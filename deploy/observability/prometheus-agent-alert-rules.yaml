# Requires kube-state-metrics scraping this namespace. Without it, exit codes
# 3/4 are invisible: they show up only in `kubectl describe pod` (last state /
# exit code) and in the container's own stderr, neither of which pages anyone.
groups:
  - name: sessionlayer-agent-exit-codes
    rules:
      - alert: AgentPossibleCloneDetected
        expr: kube_pod_container_status_last_terminated_reason{namespace="sessionlayer",container="agent",reason="Error"}
          * on(namespace, pod, container) group_left()
          kube_pod_container_status_last_terminated_exitcode{namespace="sessionlayer",container="agent"} == 3
        for: 0m
        labels: { severity: critical, security: clone-detection }
        annotations:
          summary: "Agent on {{ $labels.pod }} exited 3 (possible clone)"
          description: "Generation mismatch: the CP auto-locked this identity. Do NOT let the orchestrator silently loop past this - treat as a SECURITY incident and re-provision."
          runbook_url: "https://github.com/SessionLayer/Documentation/blob/main/docs/operations/agent-runbook.md#alert-security-generation-mismatch-on-renewal--auto-locked-exit-3"

      - alert: AgentIdentityRepairNeeded
        expr: kube_pod_container_status_last_terminated_reason{namespace="sessionlayer",container="agent",reason="Error"}
          * on(namespace, pod, container) group_left()
          kube_pod_container_status_last_terminated_exitcode{namespace="sessionlayer",container="agent"} == 4
        for: 0m
        labels: { severity: critical }
        annotations:
          summary: "Agent on {{ $labels.pod }} exited 4 (repair needed)"
          description: "The Control Plane refused this identity (locked / unknown-rotated cert / stale generation) - not transient. Re-provision via the join-token API; do not expect this to clear on its own."
          runbook_url: "https://github.com/SessionLayer/Documentation/blob/main/docs/operations/agent-runbook.md#alert-repair-needed-renewal-rejected--exit-4"

      - alert: AgentCrashLoopingOnTransientExit
        expr: rate(kube_pod_container_status_restarts_total{namespace="sessionlayer",container="agent"}[15m]) > 0
          and on(namespace, pod, container)
          kube_pod_container_status_last_terminated_exitcode{namespace="sessionlayer",container="agent"} == 1
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "Agent on {{ $labels.pod }} repeatedly exiting 1 over 15m"
          description: "Exit 1 is normally transient (CP blip / disk), but a sustained loop means it isn't self-healing - check node connectivity and CP reachability from this node."
          runbook_url: "https://github.com/SessionLayer/Documentation/blob/main/docs/operations/agent-runbook.md#symptom-repeated-transient-renewal-warnings-never-succeeding"
