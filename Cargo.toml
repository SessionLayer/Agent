[package]
name = "sessionlayer-agent"
version = "0.0.2"
edition = "2021"
rust-version = "1.97"
description = "SessionLayer Agent - per-node outbound connector for the Zero-Trust SSH platform."
license = "GPL-3.0-only"
repository = "https://github.com/SessionLayer/Agent"
readme = "README.md"
publish = false

[lib]
name = "sessionlayer_agent"
path = "src/lib.rs"

[[bin]]
name = "sessionlayer-agent"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "signal", "time", "sync", "net", "io-util"] }

# The Agent<->Gateway wire transport: a framed binary protocol over a
# mutually-authenticated WebSocket. `tokio-tungstenite` carries NO TLS feature on
# purpose - we hand it an already established `tokio_rustls` TLS 1.3 stream, so a
# second TLS backend can never enter the tree (deny.toml bans OpenSSL; the
# provider is `ring`).
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

tonic = { version = "0.14", features = ["tls-ring"] }
tonic-prost = "0.14"
prost = "0.14"

# TLS backend, pinned and installed process-wide at startup (single explicit
# crypto provider before any TLS is negotiated). ring backend; TLS 1.3-only by
# construction (no `tls12`) - both ends of the Agent's plane are first-party.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }

rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }

# Proof-of-possession signing for MtlsJoin: the operator pre-provisioned key
# signs a binding over the enrollment CSR (ECDSA-P256/SHA-256, ASN.1 DER - what
# the CP verifies with SHA256withECDSA). `pkcs8`/`pem` load the operator key.
# `getrandom` is test-only (throwaway keypairs in `supply_chain::tests`, via the
# `Generate` trait) but is a crate-wide feature, not a per-dependency-set one;
# p256 0.14 moved its RNG bound to a newer, separate `rand_core` major (0.10,
# via `elliptic-curve`/`crypto-common`) that our own `rand_core` dependency
# below does not implement, so `Generate::generate()`'s ambient RNG path is the
# fix, not a second explicit RNG plumbed through.
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "pkcs8", "pem", "std", "getrandom"] }

# OS RNG for the renew-ahead jitter sample. rand_core 0.6, NOT the same major
# p256/ecdsa now pull in internally (0.10, self-contained behind p256's own
# `getrandom` feature above) - the two never need to interoperate.
rand_core = { version = "0.6", features = ["getrandom"] }

pem = "3"

x509-parser = { version = "0.18", features = ["verify"] }
sha2 = "0.11"
base64 = "0.23"
semver = "1"

fd-lock = "4"

zeroize = { version = "1", features = ["zeroize_derive"] }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

opentelemetry = "0.32"
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["grpc-tonic", "trace", "tls-ring"] }
tracing-opentelemetry = "0.33"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

thiserror = "2"
anyhow = "1"

clap = { version = "4", features = ["derive"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
seccompiler = "0.5"
landlock = "0.4"

[build-dependencies]
tonic-prost-build = "0.14"

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "time", "sync", "test-util", "net", "io-util"] }
tokio-stream = { version = "0.1", features = ["net"] }
tempfile = "3"
testcontainers = "0.28"
# The mock CP signs the Agent's CSRs → needs rcgen CSR parsing (`x509-parser`).
# Kept in dev-deps only: Cargo feature-unification adds it to test builds while
# x509-parser is a direct dependency in its own right (see the `[dependencies]`
# entry above), so this feature adds no new edge to the tree. Mirrors
# the Gateway.
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem", "x509-parser"] }
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"
