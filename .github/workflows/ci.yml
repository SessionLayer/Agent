# SessionLayer Agent — CI.
#
# ONE required job, id `gate`, so the branch-protection required check is
# literally `gate`. All third-party actions are pinned to a full commit SHA (supply-chain hardening,
# NFR-7); the trailing `# vX.Y.Z` is the human-readable tag.
name: ci

on:
  push:
  pull_request:

# Least privilege: the gate only reads the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Real drift gate: clones SessionLayer/Contracts at the tag pinned in
      # contracts.lock, verifies the resolved SHA, and diffs the vendored
      # copies -- a sibling-checkout-path sync would no-op here, since CI
      # checks out one repo at a time and a sibling path never exists.
      - name: Verify vendored contracts (contracts.lock)
        run: ./scripts/vendor-contracts.sh --check

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends protobuf-compiler
          protoc --version

      - name: Install Rust toolchain (pinned by rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # pinned commit (action publishes no semver tags)
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy
          # arm64 std for the aarch64 build-level proof below.
          targets: aarch64-unknown-linux-gnu

      - name: Cache cargo build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Install cargo-nextest, cargo-deny, cargo-audit (pinned)
        uses: taiki-e/install-action@7572810d7dd469b651bb7793945692cf78da5dd7 # v2.85.0
        with:
          # Pin the supply-chain enforcers themselves so the gate is reproducible
          # (NFR-7) — bump via reviewed PRs, matching the toolchain/action pins.
          tool: cargo-nextest@0.9.135,cargo-deny@0.19.6,cargo-audit@0.22.1

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo nextest
        run: cargo nextest run --all-features

      - name: cargo audit
        run: cargo audit -D warnings

      - name: cargo deny
        run: cargo deny check

      # Build-level proof the arm64 target compiles — the Tier-0 seccomp allow-list
      # is arch-parameterized, so aarch64 needs its own compile check. `ring`'s
      # C needs the cross linker/compiler; std comes from the toolchain `targets`.
      - name: Install aarch64 cross linker + target libc headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu libc6-dev-arm64-cross
      - name: aarch64 cross-check (cargo check --target aarch64-unknown-linux-gnu)
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar
        run: cargo check --target aarch64-unknown-linux-gnu --locked

  # Deliberately NOT the required check — `gate` is. This runs on every push and
  # pull request so the image cannot rot into something nobody builds, and it
  # asserts the runtime posture the DaemonSet depends on.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      IMG: sessionlayer/agent:ci
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build linux/amd64
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ env.IMG }}
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}

      # Compile proof only: nothing needs to execute, and the cross-compiled
      # arm64 binary cannot run on the runner anyway.
      - name: Build linux/arm64
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/arm64
          push: false
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}

      - name: Assert the runtime posture
        env:
          EXPECT_VERSION: ${{ github.ref_name }}
          EXPECT_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail

          user=$(docker image inspect -f '{{.Config.User}}' "$IMG")
          echo "USER: ${user:-<empty>}"
          case "$user" in
            ""|root|0|root:*|0:*) echo "::error::image runs as ${user:-<empty>}; runAsNonRoot cannot enforce this"; exit 1 ;;
          esac

          # The positive control: the entrypoint itself must run. Without it, a
          # container runtime broken for any unrelated reason would make the
          # no-shell assertion below pass for the wrong reason.
          docker run --rm "$IMG" --version

          if docker run --rm --entrypoint /bin/sh "$IMG" -c true 2>/dev/null; then
            echo "::error::/bin/sh exists in the final layer"; exit 1
          fi
          echo "no shell in the final layer"

          labels=$(docker image inspect -f '{{json .Config.Labels}}' "$IMG")
          for key in title description source licenses version revision; do
            value=$(printf '%s' "$labels" | jq -r --arg k "org.opencontainers.image.$key" '.[$k] // ""')
            echo "org.opencontainers.image.$key = ${value:-<empty>}"
            [ -n "$value" ] || { echo "::error::label org.opencontainers.image.$key is unset"; exit 1; }
          done

          # version/revision must come from the build args, not a baked constant.
          got_version=$(printf '%s' "$labels" | jq -r '."org.opencontainers.image.version"')
          got_revision=$(printf '%s' "$labels" | jq -r '."org.opencontainers.image.revision"')
          [ "$got_version" = "$EXPECT_VERSION" ] || { echo "::error::version label is '$got_version', expected '$EXPECT_VERSION'"; exit 1; }
          [ "$got_revision" = "$EXPECT_REVISION" ] || { echo "::error::revision label is '$got_revision', expected '$EXPECT_REVISION'"; exit 1; }
